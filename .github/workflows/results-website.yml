name: Publish model results website

on:
  push:
    branches: [main]
    paths:
      - "example_systems/0_nine_zones_w_multistage/Results_EPRI.xlsb"
      - "example_systems/0_nine_zones_w_multistage/results_kmeans_myopic/**"
      - "example_systems/0_nine_zones_w_multistage/results_sampled_myopic/**"
      - "example_systems/0_nine_zones_w_multistage/inputs/**"
      - "example_systems/0_nine_zones_w_multistage/website/**"
      - ".github/workflows/results-website.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: results-website-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: example_systems/0_nine_zones_w_multistage/website/requirements.txt
      - name: Install data-build dependencies
        run: pip install -r example_systems/0_nine_zones_w_multistage/website/requirements.txt
      - name: Rebuild website data and downloads
        working-directory: example_systems/0_nine_zones_w_multistage/website
        run: |
          python tools/build_results_data.py --case-root .. --output dist/data/results-data.js
          python tools/build_download_workbooks.py --data dist/data/results-data.js --output-dir dist/downloads
      - name: Validate static assets
        working-directory: example_systems/0_nine_zones_w_multistage/website
        run: |
          node --check dist/app.js
          test -s dist/index.html
          test -s dist/compare.html
          test -s dist/data/results-data.js
          test -s dist/downloads/epri-results.xlsx
          test -s dist/downloads/genx-kmeans-myopic-results.xlsx
          test -s dist/downloads/genx-sampled-weeks-myopic-results.xlsx
      - name: Commit refreshed generated files
        run: |
          git add example_systems/0_nine_zones_w_multistage/website/dist/data/results-data.js
          git add -f example_systems/0_nine_zones_w_multistage/website/dist/downloads/*.xlsx
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh model results website data"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: example_systems/0_nine_zones_w_multistage/website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
